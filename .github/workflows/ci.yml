name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No go.work is committed on purpose, so every job here builds against
# the versions go.mod pins - the same ones a release is built from,
# rather than the sibling checkouts a development machine has.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      # The tool feeds server-supplied names to golang.org/x/net/idna,
      # so a vulnerability in a dependency is a vulnerability here.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
