# go-cgp-acme configuration. Copy to /etc/go-cgp-acme.toml and adjust.

# Output level: 0 reports only what changed, 1 adds a line per domain,
# 2 also traces the ACME exchange. Repeating --verbose sets it per run.
verbose = 0

[cgp]
host = "localhost"
login = "postmaster@localhost"
password = "secret"

# Transport for the PWD/CLI session: "none", "tls" (encrypted from the
# first byte) or "starttls" (connect in the clear, upgrade with STLS
# before authenticating). Also --tls for one run.
#
# This is an administrative session: with "none" every command and every
# response crosses the network in clear text and the server is never
# authenticated, and the default APOP login only spares the password
# itself - the challenge and its digest are on the wire and can be
# attacked offline. "none" is the default because a node normally renews
# its own certificates over the loopback interface; set "tls" or
# "starttls" for anything else. The client warns when it would send
# cleartext to a host that is not local.
tls = "none"

# PWD/CLI port. Omit it to follow the transport: 106 for "none" and
# "starttls", 1106 for "tls".
# port = 106

[acme]
# Registration and recovery contact. Empty asks the server for the
# address of the account below, and registers without a contact if that
# address is not one a CA could write to.
email = ""

# ACME directory endpoint (required). Point it at any RFC 8555 CA.
directory_url = "https://acme-v02.api.letsencrypt.org/directory"

# Optional staging/test endpoint, used instead of directory_url when
# --staging is given. There is no staging switch here on purpose: that
# run reports its certificate instead of installing it, which is worth
# asking for while testing and not a state to leave a machine in.
staging_url = "https://acme-staging-v02.api.letsencrypt.org/directory"

# External Account Binding, required by some CAs to register an account.
# Key ID and base64 HMAC key from the CA console. Leave empty for CAs
# that do not use EAB (e.g. Let's Encrypt).
eab_kid = ""
eab_key = ""

# RSA key size for issued certificates. CommuniGate Pro supports RSA
# only.
key_bits = 2048

# Renew once less than this fraction of a certificate's lifetime
# remains, so the window scales with validity (90-day -> 30 days out,
# 6-day -> 2 days). Range [0, 1); default 1/3.
renew_fraction = 0.333

# Optional absolute floor: also renew once less than this remains,
# whichever window is larger. "0h" (default) lets renew_fraction govern.
renew_before = "0h"

[domains]
# Process only this node's local domains: the main domain and any
# regular non-Shared domains. In a Dynamic Cluster enable this on every
# node (also: --onlylocal).
only_local = false

# Process only the cluster's Shared (cluster-wide) domains. Enable this
# on the one designated node (also: --onlyshared). Setting both
# only_local and only_shared cancels out: both are ignored.
only_shared = false

# When non-empty, process only these domains.
include = []

# Domains and domain aliases to skip. This catches everything that
# should never reach ACME: internal-only login aliases that are not in
# DNS, domains under a different certificate policy, or filesystem
# artifacts that CommuniGate Pro mistakes for domains (a classic one is
# "lost+found" appearing after an NFS mount of SharedDomains).
exclude = []

[storage]
# CommuniGate Pro Account File Storage directory (of the CLI account)
# holding the ACME account key and the certificate archive.
path = "private/acme"
